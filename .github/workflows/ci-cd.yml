name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman and podman-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y podman buildah uidmap slirp4netns fuse-overlayfs python3-pip
          python3 -m pip install --user podman-compose
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Podman compose config
        run: podman-compose -f podman-compose.yml config

      - name: Podman compose build
        run: podman-compose -f podman-compose.yml build backend

  publish-image:
    name: Publish Podman image
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman buildah uidmap slirp4netns fuse-overlayfs

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Compute image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          podman build \
            -f Containerfile.podman \
            -t "${{ env.IMAGE_NAME }}:latest" \
            -t "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            .

      - name: Push latest image
        run: podman push "${{ env.IMAGE_NAME }}:latest"

      - name: Push commit image
        run: podman push "${{ env.IMAGE_NAME }}:${{ github.sha }}"
