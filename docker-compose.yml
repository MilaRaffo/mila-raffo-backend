services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mila-raffo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-./.docker/postgres-data}:/var/lib/postgresql/data
    networks:
      - mila-raffo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  mila-raffo-network:
    driver: bridge
